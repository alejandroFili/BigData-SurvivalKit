# Redpanda Self-Managed Documentation
# https://docs.redpanda.com/current/home/
name: redpanda
# Necesario descomentar para obtener persistencia en el broker
# volumes:
#   redpanda: null
services:
  redpanda:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6
    container_name: redpanda
    hostname: redpanda
    # Necesario descomentar para obtener persistencia en el broker
    #     volumes:
    #       - redpanda:/var/lib/redpanda/data
    networks:
      # OJO: necesario crear previamente networks etsiinf y kafka!!!
      # Los contenedores Kafka (redpanda) comunican a través de la red kafka aunque
      # son accesibles también desde la red etsiinf
      - default
      - etsiinf
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  ksqldb-server:
    # https://hub.docker.com/r/confluentinc/ksqldb-server
    image: confluentinc/ksqldb-server:latest
    container_name: ksqldb-server
    hostname: ksqldb-server
    # restart: always
    ports:
      - 127.0.0.1:8088:8088
    networks:
      - default
      - etsiinf
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_ADVERTISED_LISTENER: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: "redpanda:9092"
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://redpanda:8081
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: true
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: true
      KSQL_HOST_NAME: ksqldb-server
      KSQL_SASL_MECHANISM: PLAIN
      KSQL_CONFLUENT_SUPPORT_METRICS_ENABLE: false
      # Configuration to embed Kafka Connect support.
      KSQL_CONNECT_GROUP_ID: "ksql-connect-cluster"
      KSQL_CONNECT_BOOTSTRAP_SERVERS: "redpanda:9092"
      KSQL_CONNECT_REST_ADVERTISED_HOST_NAME: "ksqldb"
      KSQL_CONNECT_REST_PORT: 8083
      KSQL_CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      KSQL_CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      KSQL_CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://redpanda:8081"
      KSQL_CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://redpanda:8081"
      KSQL_CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KSQL_CONNECT_CONFIG_STORAGE_TOPIC: "ksql-connect-configs"
      KSQL_CONNECT_OFFSET_STORAGE_TOPIC: "ksql-connect-offsets"
      KSQL_CONNECT_STATUS_STORAGE_TOPIC: "ksql-connect-statuses"
      KSQL_CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      KSQL_CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      KSQL_CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KSQL_CONNECT_PLUGIN_PATH: "/usr/share/kafka/plugins"
    healthcheck:
      start_period: 10s
      interval: 10s
      retries: 20
      test: curl -fail --silent http://ksqldb-server:8088/info | grep RUNNING 1>/dev/null || exit 1
    volumes:
      - ./confluent-hub-components:/usr/share/kafka/plugins
      - ./shared_server:/home/appuser/shared_server
    depends_on:
      - redpanda

  ksqldb-cli:
    image: confluentinc/ksqldb-cli:latest
    container_name: ksqldb-cli
    volumes:
      - ./shared_cli:/home/appuser/shared_cli
    depends_on:
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true

networks:
  default:
    name: kafka
    external: true
  etsiinf:
    name: etsiinf
    external: true
